<svg viewBox="0 0 640 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1326"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
  </defs>
  <rect width="640" height="480" fill="url(#sky)"/>
  <!-- Faint stars -->
  <g fill="#fff" opacity="0.5">
    <circle cx="80" cy="60" r="1.2"/>
    <circle cx="140" cy="100" r="0.9"/>
    <circle cx="220" cy="40" r="1.1"/>
    <circle cx="420" cy="80" r="1"/>
    <circle cx="500" cy="50" r="1.4"/>
    <circle cx="560" cy="130" r="0.8"/>
  </g>
  <!-- Distant building outlines -->
  <g fill="#1f2937" opacity="0.8">
    <rect x="20" y="320" width="80" height="160"/>
    <rect x="120" y="280" width="100" height="200"/>
    <rect x="440" y="300" width="90" height="180"/>
    <rect x="540" y="260" width="80" height="220"/>
  </g>
  <!-- Some lit windows -->
  <g fill="#fbbf24" opacity="0.7">
    <rect x="40" y="340" width="8" height="10"/>
    <rect x="60" y="360" width="8" height="10"/>
    <rect x="150" y="320" width="8" height="10"/>
    <rect x="180" y="380" width="8" height="10"/>
    <rect x="460" y="340" width="8" height="10"/>
    <rect x="500" y="380" width="8" height="10"/>
    <rect x="560" y="300" width="8" height="10"/>
    <rect x="585" y="360" width="8" height="10"/>
  </g>
  <!-- Streetlight pole -->
  <line x1="320" y1="100" x2="320" y2="430" stroke="#525252" stroke-width="8" stroke-linecap="round"/>
  <!-- Arm -->
  <line x1="320" y1="120" x2="380" y2="100" stroke="#525252" stroke-width="6" stroke-linecap="round"/>
  <!-- Lamp head (dark / dead) -->
  <ellipse cx="385" cy="100" rx="22" ry="14" fill="#1f2937" stroke="#525252" stroke-width="3"/>
  <!-- Cracked glass marks -->
  <g stroke="#000" stroke-width="2" fill="none">
    <line x1="372" y1="100" x2="398" y2="100"/>
    <line x1="385" y1="92" x2="382" y2="110"/>
  </g>
  <!-- "Off" cross -->
  <g stroke="#dc2626" stroke-width="3" stroke-linecap="round">
    <line x1="375" y1="90" x2="395" y2="110"/>
    <line x1="395" y1="90" x2="375" y2="110"/>
  </g>
  <!-- Faint ground glow (would be lit if working) -->
  <ellipse cx="385" cy="430" rx="60" ry="12" fill="rgba(251,191,36,0.05)"/>
  <!-- Road -->
  <rect x="0" y="430" width="640" height="50" fill="#0a0a0a"/>
  <!-- Label -->
  <g>
    <rect x="20" y="20" width="300" height="44" rx="6" fill="rgba(0,0,0,0.75)"/>
    <text x="40" y="50" font-family="Inter,system-ui,sans-serif" font-size="22" font-weight="900" fill="#fbbf24" letter-spacing="2">⚠ STREETLIGHT OUT</text>
  </g>
</svg>
