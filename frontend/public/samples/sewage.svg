<svg viewBox="0 0 640 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gnd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f3f46"/>
      <stop offset="1" stop-color="#18181b"/>
    </linearGradient>
  </defs>
  <rect width="640" height="480" fill="url(#gnd)"/>
  <!-- Pavement crack pattern -->
  <g stroke="#27272a" stroke-width="2" fill="none" opacity="0.5">
    <path d="M0,300 L640,300"/>
    <path d="M0,360 L640,360"/>
    <path d="M0,420 L640,420"/>
    <path d="M100,300 L100,480"/>
    <path d="M280,300 L280,480"/>
    <path d="M460,300 L460,480"/>
  </g>
  <!-- Manhole cover (open) -->
  <ellipse cx="320" cy="370" rx="80" ry="25" fill="#0a0a0a"/>
  <ellipse cx="320" cy="365" rx="80" ry="22" fill="#27272a" stroke="#3f3f46" stroke-width="3"/>
  <!-- Lid tilted to side -->
  <ellipse cx="450" cy="385" rx="50" ry="15" fill="#3f3f46" stroke="#52525b" stroke-width="2"/>
  <!-- Sewage overflowing puddle -->
  <ellipse cx="320" cy="400" rx="220" ry="50" fill="#4d3a1a" opacity="0.85"/>
  <ellipse cx="320" cy="395" rx="180" ry="38" fill="#78350f" opacity="0.7"/>
  <ellipse cx="320" cy="390" rx="140" ry="26" fill="#92400e" opacity="0.5"/>
  <!-- Bubbles -->
  <g fill="#78350f">
    <circle cx="250" cy="385" r="6"/>
    <circle cx="290" cy="395" r="4"/>
    <circle cx="360" cy="390" r="7"/>
    <circle cx="400" cy="402" r="5"/>
  </g>
  <!-- Stink lines -->
  <g stroke="#84cc16" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.65">
    <path d="M220,340 C225,320 215,305 220,285"/>
    <path d="M280,330 C285,310 275,295 280,275"/>
    <path d="M340,335 C345,315 335,300 340,280"/>
    <path d="M400,330 C405,310 395,295 400,275"/>
  </g>
  <!-- Background buildings -->
  <g fill="#27272a">
    <rect x="0" y="180" width="120" height="120"/>
    <rect x="160" y="200" width="80" height="100"/>
    <rect x="520" y="190" width="120" height="110"/>
  </g>
  <!-- Label -->
  <g>
    <rect x="20" y="20" width="320" height="44" rx="6" fill="rgba(0,0,0,0.75)"/>
    <text x="40" y="50" font-family="Inter,system-ui,sans-serif" font-size="22" font-weight="900" fill="#fbbf24" letter-spacing="2">⚠ SEWAGE OVERFLOW</text>
  </g>
</svg>
