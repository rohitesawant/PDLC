<svg viewBox="0 0 640 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b5563"/>
      <stop offset="1" stop-color="#1f2937"/>
    </linearGradient>
  </defs>
  <rect width="640" height="480" fill="url(#wall)"/>
  <!-- Pavement -->
  <rect x="0" y="400" width="640" height="80" fill="#374151"/>
  <line x1="0" y1="400" x2="640" y2="400" stroke="#111827" stroke-width="2"/>
  <!-- Dumpster body -->
  <rect x="180" y="240" width="280" height="180" rx="10" fill="#15803d"/>
  <rect x="180" y="240" width="280" height="40" fill="#166534"/>
  <!-- Dumpster slats (texture) -->
  <g stroke="#14532d" stroke-width="2">
    <line x1="180" y1="320" x2="460" y2="320"/>
    <line x1="180" y1="360" x2="460" y2="360"/>
  </g>
  <!-- Wheels -->
  <circle cx="220" cy="425" r="14" fill="#111827"/>
  <circle cx="420" cy="425" r="14" fill="#111827"/>
  <!-- Open lid (tilted) -->
  <polygon points="170,250 470,250 480,210 160,210" fill="#166534"/>
  <!-- Overflowing trash bags -->
  <g>
    <ellipse cx="240" cy="200" rx="50" ry="35" fill="#0a0a0a"/>
    <ellipse cx="320" cy="180" rx="60" ry="40" fill="#171717"/>
    <ellipse cx="400" cy="200" rx="50" ry="35" fill="#0a0a0a"/>
    <ellipse cx="290" cy="160" rx="35" ry="22" fill="#262626"/>
  </g>
  <!-- Bag ties / knots -->
  <g fill="#525252">
    <circle cx="240" cy="170" r="4"/>
    <circle cx="320" cy="148" r="5"/>
    <circle cx="400" cy="170" r="4"/>
  </g>
  <!-- Trash on the ground -->
  <g fill="#0a0a0a">
    <circle cx="140" cy="430" r="10"/>
    <circle cx="160" cy="445" r="6"/>
    <circle cx="490" cy="440" r="8"/>
    <circle cx="510" cy="430" r="5"/>
    <ellipse cx="520" cy="455" rx="15" ry="6"/>
  </g>
  <!-- Stink lines -->
  <g stroke="#84cc16" stroke-width="2" fill="none" opacity="0.6" stroke-linecap="round">
    <path d="M260,130 C265,115 255,105 260,90"/>
    <path d="M320,115 C325,100 315,90 320,75"/>
    <path d="M380,130 C385,115 375,105 380,90"/>
  </g>
  <!-- Flies -->
  <g fill="#fbbf24">
    <circle cx="220" cy="100" r="2"/>
    <circle cx="350" cy="80" r="2"/>
    <circle cx="430" cy="105" r="2"/>
  </g>
  <!-- Label -->
  <g>
    <rect x="20" y="20" width="320" height="44" rx="6" fill="rgba(0,0,0,0.75)"/>
    <text x="40" y="50" font-family="Inter,system-ui,sans-serif" font-size="22" font-weight="900" fill="#fbbf24" letter-spacing="2">⚠ GARBAGE OVERFLOW</text>
  </g>
</svg>
